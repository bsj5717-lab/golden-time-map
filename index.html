<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>응급환자 질환별 골든타임 및 실제 도로 이동거리 분석 (Google Maps)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .panel {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      width: 330px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 10px;
      padding: 14px 15px;
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.2);
      border: 1px solid #cbd5e1;
    }
    .panel h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .status-banner {
      font-size: 11.5px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .status-ok {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .status-err {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11.5px;
      line-height: 1.55;
      color: #334155;
    }
    .section {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid #e2e8f0;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .delay-val {
      color: #d97706;
      font-size: 14px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #d97706;
    }
    .range-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: #64748b;
      margin-top: 3px;
    }
    .disease-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      margin: 7px 0;
      cursor: pointer;
    }
    .disease-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .color-dot {
      font-weight: bold;
      font-size: 14px;
    }
    .count-pill {
      font-size: 11px;
      font-weight: 700;
      background: #f1f5f9;
      padding: 2px 7px;
      border-radius: 999px;
      color: #334155;
    }
    .formula {
      margin-top: 8px;
      font-size: 10.5px;
      color: #64748b;
      line-height: 1.45;
      background: #f8fafc;
      padding: 7px 8px;
      border-radius: 6px;
    }
    .btn-fit {
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #1e293b;
    }
    .btn-fit:hover {
      background: #f1f5f9;
    }
    .rank-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .rank-item {
      font-size: 11.5px;
      padding: 7px 9px;
      border-radius: 7px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .rank-item:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .rank-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .rank-sub {
      color: #475569;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>지도 분석 설정</h1>
    <div id="status-banner" class="status-banner status-ok">데이터 불러오는 중...</div>

    <div class="summary-box" id="summary-box"></div>

    <div class="section">
      <div class="label-row">
        <span>지체계수:</span>
        <span class="delay-val" id="delay-value">1.3</span>
      </div>
      <input id="delay-slider" type="range" min="1.0" max="2.0" step="0.1" value="1.3" />
      <div class="range-ticks">
        <span>1.0</span>
        <span>1.5</span>
        <span>2.0</span>
      </div>
    </div>

    <div class="section">
      <div class="label-row"><span>질환별 골든타임 경로 표시</span></div>
      <div id="disease-checkboxes"></div>
      <div class="formula" id="formula-text">
        지체계수에 따라 예상시간과 골든타임 충족 경로를 다시 표시합니다.<br />
        예상시간 = 거리 ÷ 40km/h × 60 × 지체계수
      </div>
      <button type="button" class="btn-fit" id="btn-fit-all">서울 전체 병원 한눈에 보기</button>
    </div>

    <div class="section">
      <div class="label-row">
        <span>병원별 도로거리·예상시간 순위</span>
        <span id="total-hospital-badge" style="font-size:11px;color:#2563eb;">-</span>
      </div>
      <div class="rank-list" id="rank-list"></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let infoWindow;
    let patientMarker;
    let hospitalMarkers = [];
    let routePolylines = [];
    let simData = null;
    let activeDisease = {};

    // 빨간색 환자 핀 SVG (Folium 빨간색 + 사람 아이콘 스타일)
    function getPatientIcon() {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
          <path d="M17 1C8.7 1 2 7.7 2 16c0 10.5 15 26 15 26s15-15.5 15-26C32 7.7 25.3 1 17 1z" fill="#d63e2a" stroke="#ffffff" stroke-width="2"/>
          <circle cx="17" cy="13" r="4" fill="#ffffff"/>
          <path d="M10.5 23c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" fill="#ffffff"/>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(34, 44),
        anchor: new google.maps.Point(17, 43)
      };
    }

    // 파란색 병원 핀 SVG (Folium 파란색 + 흰색 십자가 '+' 아이콘 스타일)
    function getHospitalIcon() {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">
          <path d="M15 1C7.8 1 2 6.8 2 14c0 9.4 13 24 13 24s13-14.6 13-24C28 6.8 22.2 1 15 1z" fill="#38aadd" stroke="#ffffff" stroke-width="1.8"/>
          <rect x="13.2" y="8.5" width="3.6" height="11" rx="0.8" fill="#ffffff"/>
          <rect x="9.5" y="12.2" width="11" height="3.6" rx="0.8" fill="#ffffff"/>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(30, 40),
        anchor: new google.maps.Point(15, 39)
      };
    }

    function calcMinutes(distanceKm, speedKmh, factor) {
      return (distanceKm / speedKmh) * 60.0 * factor;
    }

    function clearRoutes() {
      routePolylines.forEach((p) => p.setMap(null));
      routePolylines = [];
    }

    function fitAllBounds() {
      if (!map || !simData) return;
      const bounds = new google.maps.LatLngBounds();
      bounds.extend({ lat: Number(simData.patient.lat), lng: Number(simData.patient.lng) });
      (simData.routes || []).forEach((r) => {
        bounds.extend({ lat: Number(r.lat), lng: Number(r.lng) });
      });
      map.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 360 });
    }

    function createHospitalMarkers() {
      hospitalMarkers.forEach((m) => m.setMap(null));
      hospitalMarkers = [];

      const icon = getHospitalIcon();
      (simData.routes || []).forEach((r) => {
        const marker = new google.maps.Marker({
          position: { lat: Number(r.lat), lng: Number(r.lng) },
          map: map,
          title: r.name,
          icon: icon,
          zIndex: 50
        });

        marker.addListener("click", () => {
          openInfo(r, { lat: Number(r.lat), lng: Number(r.lng) });
        });
        hospitalMarkers.push(marker);
      });
    }

    function openInfo(r, pos) {
      const speed = Number(simData.meta?.speed_kmh) || 40;
      const factor = parseFloat(document.getElementById("delay-slider").value);
      const minutes = calcMinutes(Number(r.distance_km), speed, factor);
      const diseases = simData.meta?.diseases || [];

      const statusRows = diseases.map((d) => {
        const ok = minutes <= Number(d.limit);
        const diff = (Number(d.limit) - minutes).toFixed(2);
        return `<div><span style="color:${d.color};font-weight:bold;">●</span> ${d.name} (${d.limit}분): ` +
          (ok ? `<b style="color:#15803d;">충족 (+${diff}분)</b>` : `<b style="color:#b91c1c;">미충족 (${diff}분)</b>`) +
          `</div>`;
      }).join("");

      infoWindow.setContent(`
        <div style="font-size:12.5px;line-height:1.55;max-width:270px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:3px;">${r.name}</div>
          <div style="color:#64748b;font-size:11px;margin-bottom:6px;">${r.address || ""}</div>
          <div>도로거리: <b>${Number(r.distance_km).toFixed(2)} km</b></div>
          <div>예상시간 (계수 ${factor.toFixed(1)}): <b>${minutes.toFixed(2)} 분</b></div>
          <div style="margin-top:6px;padding-top:5px;border-top:1px solid #e2e8f0;">${statusRows}</div>
        </div>
      `);
      infoWindow.setPosition(pos);
      infoWindow.open(map);
    }

    function redraw() {
      if (!map || !simData) return;

      const speed = Number(simData.meta?.speed_kmh) || 40;
      const factor = parseFloat(document.getElementById("delay-slider").value);
      document.getElementById("delay-value").textContent = factor.toFixed(1);

      clearRoutes();

      const diseases = simData.meta?.diseases || [];
      const routes = simData.routes || [];

      // Folium 코드와 동일하게 질환별 레이어 순서대로 Polyline 그리기
      // (뇌졸중 60분 노란색이 먼저 넓게 깔리고, 그 위에 중증응급 파란색, 심정지 빨간색이 겹쳐 보임)
      const drawOrder = [...diseases].sort((a, b) => Number(b.limit) - Number(a.limit));

      drawOrder.forEach((d, idx) => {
        if (!activeDisease[d.name]) return;

        routes.forEach((r) => {
          const minutes = calcMinutes(Number(r.distance_km), speed, factor);
          if (minutes <= Number(d.limit) && Array.isArray(r.coordinates) && r.coordinates.length > 1) {
            const polyline = new google.maps.Polyline({
              path: r.coordinates,
              geodesic: true,
              strokeColor: d.color,
              strokeOpacity: 0.85,
              strokeWeight: 5 + idx,
              zIndex: 10 + idx,
              map: map
            });

            polyline.addListener("click", (e) => {
              openInfo(r, e.latLng || { lat: Number(r.lat), lng: Number(r.lng) });
            });
            routePolylines.push(polyline);
          }
        });
      });

      // 질환별 도달 가능 병원 수 업데이트
      diseases.forEach((d, idx) => {
        const cnt = routes.filter((r) => calcMinutes(Number(r.distance_km), speed, factor) <= Number(d.limit)).length;
        const badge = document.getElementById(`disease-count-${idx}`);
        if (badge) badge.textContent = `${cnt}개`;
      });

      // 순위 리스트 갱신
      const sorted = [...routes]
        .map((r) => ({ ...r, eta: calcMinutes(Number(r.distance_km), speed, factor) }))
        .sort((a, b) => Number(a.distance_km) - Number(b.distance_km));

      document.getElementById("total-hospital-badge").textContent = `총 ${sorted.length}곳`;
      const rankList = document.getElementById("rank-list");
      rankList.innerHTML = "";

      sorted.forEach((r, idx) => {
        const div = document.createElement("div");
        div.className = "rank-item";
        div.innerHTML = `
          <div class="rank-top">
            <span>${idx + 1}. ${r.name}</span>
            <span>${Number(r.distance_km).toFixed(2)}km</span>
          </div>
          <div class="rank-sub">예상시간 ${r.eta.toFixed(2)}분</div>
        `;
        div.addEventListener("click", () => {
          map.panTo({ lat: Number(r.lat), lng: Number(r.lng) });
          map.setZoom(14);
          openInfo(r, { lat: Number(r.lat), lng: Number(r.lng) });
        });
        rankList.appendChild(div);
      });
    }

    async function initMap() {
      const banner = document.getElementById("status-banner");

      try {
        const res = await fetch("./routes_data.json?v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        simData = await res.json();
        if (!simData || !simData.patient || !Array.isArray(simData.routes) || simData.routes.length === 0) {
          throw new Error("routes_data.json 내부에 병원 경로 데이터가 비어 있습니다.");
        }

        const totalCoords = simData.routes.reduce((acc, r) => acc + (r.coordinates ? r.coordinates.length : 0), 0);
        banner.className = "status-banner status-ok";
        banner.textContent = `연동 성공: 병원 ${simData.routes.length}곳 · 도로 좌표점 ${totalCoords.toLocaleString()}개`;
      } catch (err) {
        banner.className = "status-banner status-err";
        banner.innerHTML = `<b>routes_data.json 불러오기 실패:</b> ${err.message}<br/>GitHub 저장소에 주피터 랩에서 새로 생성한 routes_data.json이 올라가 있는지 확인하세요.`;
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 37.54, lng: 126.98 },
          zoom: 11
        });
        return;
      }

      const pt = simData.patient;
      const meta = simData.meta || {};
      const defaultFactor = Number(meta.default_delay_factor) || 1.3;

      const slider = document.getElementById("delay-slider");
      slider.value = defaultFactor;
      document.getElementById("delay-value").textContent = defaultFactor.toFixed(1);

      let trafficText = "";
      if (meta.traffic && meta.traffic.speed_kmh) {
        trafficText = `<br/>서울 교통 링크(${meta.traffic.link_id}): ${meta.traffic.speed_kmh}km/h (${meta.traffic.travel_time_sec}초)`;
      }

      document.getElementById("summary-box").innerHTML = `
        <b>환자번호:</b> ${pt.id} (${pt.district})<br/>
        <b>환자좌표:</b> ${Number(pt.lat).toFixed(5)}, ${Number(pt.lng).toFixed(5)}<br/>
        <b>병원현황:</b> 지정 ${meta.total_target_hospitals ?? 21}곳 / 경로 ${simData.routes.length}곳${trafficText}
      `;

      // 질환 체크박스 생성
      const cbDiv = document.getElementById("disease-checkboxes");
      cbDiv.innerHTML = "";
      (meta.diseases || []).forEach((d, idx) => {
        activeDisease[d.name] = true;
        const row = document.createElement("label");
        row.className = "disease-row";
        row.innerHTML = `
          <span class="disease-left">
            <input type="checkbox" checked />
            <span class="color-dot" style="color:${d.color};">●</span>
            <span>${d.name} (${d.limit}분 이내)</span>
          </span>
          <span class="count-pill" id="disease-count-${idx}">-</span>
        `;
        const cb = row.querySelector("input");
        cb.addEventListener("change", () => {
          activeDisease[d.name] = cb.checked;
          redraw();
        });
        cbDiv.appendChild(row);
      });

      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: Number(pt.lat), lng: Number(pt.lng) },
        zoom: 12,
        mapTypeControl: true,
        streetViewControl: false
      });

      infoWindow = new google.maps.InfoWindow();

      // 빨간색 환자 마커 생성
      patientMarker = new google.maps.Marker({
        position: { lat: Number(pt.lat), lng: Number(pt.lng) },
        map: map,
        title: `응급환자 발생 위치 (${pt.id} ${pt.district})`,
        icon: getPatientIcon(),
        zIndex: 999
      });

      patientMarker.addListener("click", () => {
        infoWindow.setContent(`
          <div style="font-size:13px;line-height:1.5;">
            <b>응급환자 발생 위치</b><br/>
            환자번호: ${pt.id}<br/>
            발생지역: ${pt.district}<br/>
            좌표: ${Number(pt.lat).toFixed(5)}, ${Number(pt.lng).toFixed(5)}
          </div>
        `);
        infoWindow.setPosition({ lat: Number(pt.lat), lng: Number(pt.lng) });
        infoWindow.open(map);
      });

      createHospitalMarkers();
      redraw();
      fitAllBounds();

      slider.addEventListener("input", redraw);
      document.getElementById("btn-fit-all").addEventListener("click", fitAllBounds);
    }
  </script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyABcEAcrT5m7PvlYzNsD3fl4BEnCsk0V6k&callback=initMap">
  </script>
</body>
</html>
