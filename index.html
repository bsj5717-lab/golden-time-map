<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>응급실 골든타임 접근성 시뮬레이션 (Google Maps)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
      border: 1px solid #e2e8f0;
    }
    .panel h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .panel .sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 14px;
    }
    .section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .delay-val {
      color: #d97706;
      font-weight: 700;
      font-size: 14px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #d97706;
    }
    .range-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    .disease-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 12px;
      margin-top: 8px;
      color: #334155;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-ok { background: #16a34a; }
    .dot-no { background: #dc2626; }
    .dot-pt { background: #2563eb; }
    .formula {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
    }
    .rank-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rank-item {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .rank-item:hover {
      background: #eff6ff;
    }
    .rank-top {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .badge-ok {
      color: #15803d;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
    }
    .badge-no {
      color: #b91c1c;
      background: #fee2e2;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
    }
    .rank-sub {
      color: #475569;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>응급실 골든타임 경로 분석</h1>
    <div class="sub" id="patient-summary">환자 발생지(P-001 강남구) 기준 도로 접근성</div>

    <div class="section">
      <div class="label-row">
        <span>도로 지체계수</span>
        <span class="delay-val" id="delay-value">1.3</span>
      </div>
      <input id="delay-slider" type="range" min="1.0" max="2.0" step="0.1" value="1.3" />
      <div class="range-ticks">
        <span>1.0 (원활)</span>
        <span>1.5</span>
        <span>2.0 (혼잡)</span>
      </div>
    </div>

    <div class="section disease-group">
      <div class="label-row"><span>판정 기준 질환 선택</span></div>
      <label><input type="radio" name="disease" value="10" /> 심정지 (골든타임 10분)</label>
      <label><input type="radio" name="disease" value="30" checked /> 중증응급 (골든타임 30분)</label>
      <label><input type="radio" name="disease" value="60" /> 뇌졸중·심근경색 (골든타임 60분)</label>

      <div class="legend">
        <span><i class="dot dot-pt"></i>환자</span>
        <span><i class="dot dot-ok"></i>골든타임 충족</span>
        <span><i class="dot dot-no"></i>미충족</span>
      </div>

      <div class="formula">
        예상 이동시간(분) = 도로거리(km) ÷ 40km/h × 60 × 지체계수
      </div>
    </div>

    <div class="section">
      <div class="label-row">
        <span>병원별 접근성 순위</span>
        <span id="reachable-count" style="font-size:12px;color:#2563eb;">-</span>
      </div>
      <div class="rank-list" id="rank-list"></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let infoWindow;
    let patientMarker;
    let hospitalMarkers = [];
    let routePolylines = [];

    let simData = {
      patient: { id: "P-001", region: "강남구", lat: 37.5172, lng: 127.0473 },
      routes: [
        {
          name: "차의과학대학교강남차병원",
          address: "서울특별시 강남구 논현로 566",
          lat: 37.5068,
          lng: 127.034669,
          distance_km: 2.47,
          coordinates: [
            { lat: 37.5172, lng: 127.0473 },
            { lat: 37.5120, lng: 127.0410 },
            { lat: 37.5068, lng: 127.034669 }
          ]
        },
        {
          name: "더드림병원",
          address: "서울특별시 강남구 선릉로 404",
          lat: 37.50099,
          lng: 127.050967,
          distance_km: 2.64,
          coordinates: [
            { lat: 37.5172, lng: 127.0473 },
            { lat: 37.5090, lng: 127.0490 },
            { lat: 37.50099, lng: 127.050967 }
          ]
        },
        {
          name: "연세대학교의과대학강남세브란스병원",
          address: "서울특별시 강남구 언주로 211",
          lat: 37.492807,
          lng: 127.046313,
          distance_km: 4.11,
          coordinates: [
            { lat: 37.5172, lng: 127.0473 },
            { lat: 37.5050, lng: 127.0468 },
            { lat: 37.492807, lng: 127.046313 }
          ]
        }
      ]
    };

    function calcEtaMinutes(distanceKm, delayFactor) {
      // 거리(km) / 40(km/h) * 60(분/시간) * 지체계수 = 거리 * 1.5 * 지체계수
      return (distanceKm / 40.0) * 60.0 * delayFactor;
    }

    function clearMapOverlays() {
      hospitalMarkers.forEach((m) => m.setMap(null));
      hospitalMarkers = [];
      routePolylines.forEach((p) => p.setMap(null));
      routePolylines = [];
    }

    function renderSimulation() {
      if (!map) return;

      const delayFactor = parseFloat(document.getElementById("delay-slider").value);
      const goldenMinutes = parseFloat(
        document.querySelector('input[name="disease"]:checked').value
      );
      document.getElementById("delay-value").textContent = delayFactor.toFixed(1);

      clearMapOverlays();

      const evaluated = simData.routes
        .map((r) => {
          const eta = calcEtaMinutes(r.distance_km, delayFactor);
          const isOk = eta <= goldenMinutes;
          return { ...r, eta, isOk };
        })
        .sort((a, b) => a.eta - b.eta);

      const okCount = evaluated.filter((x) => x.isOk).length;
      document.getElementById("reachable-count").textContent =
        `${okCount} / ${evaluated.length}개 충족`;

      const rankListEl = document.getElementById("rank-list");
      rankListEl.innerHTML = "";

      evaluated.forEach((item, idx) => {
        const color = item.isOk ? "#16a34a" : "#dc2626";

        // 1) 경로 Polyline 그리기
        if (Array.isArray(item.coordinates) && item.coordinates.length > 1) {
          const polyline = new google.maps.Polyline({
            path: item.coordinates,
            geodesic: true,
            strokeColor: color,
            strokeOpacity: item.isOk ? 0.85 : 0.45,
            strokeWeight: item.isOk ? 4 : 2.5,
            zIndex: item.isOk ? 20 : 10,
            map: map
          });

          polyline.addListener("click", (e) => {
            openInfo(
              item,
              e.latLng || { lat: item.lat, lng: item.lng },
              goldenMinutes
            );
          });
          routePolylines.push(polyline);
        }

        // 2) 병원 마커 생성
        const marker = new google.maps.Marker({
          position: { lat: item.lat, lng: item.lng },
          map: map,
          title: `${idx + 1}위. ${item.name}`,
          label: {
            text: String(idx + 1),
            color: "#ffffff",
            fontSize: "11px",
            fontWeight: "bold"
          },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 11,
            fillColor: color,
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2
          }
        });

        marker.addListener("click", () => {
          openInfo(item, { lat: item.lat, lng: item.lng }, goldenMinutes);
        });
        hospitalMarkers.push(marker);

        // 3) 좌측 순위 목록 카드 생성
        const card = document.createElement("div");
        card.className = "rank-item";
        card.innerHTML = `
          <div class="rank-top">
            <span>${idx + 1}. ${item.name}</span>
            <span class="${item.isOk ? "badge-ok" : "badge-no"}">${item.isOk ? "충족" : "미충족"}</span>
          </div>
          <div class="rank-sub">
            거리 ${item.distance_km.toFixed(2)}km · 예상 ${item.eta.toFixed(1)}분 (기준 ${goldenMinutes}분)
          </div>
        `;
        card.addEventListener("click", () => {
          map.panTo({ lat: item.lat, lng: item.lng });
          map.setZoom(14);
          openInfo(item, { lat: item.lat, lng: item.lng }, goldenMinutes);
        });
        rankListEl.appendChild(card);
      });
    }

    function openInfo(item, position, goldenMinutes) {
      const diff = (goldenMinutes - item.eta).toFixed(1);
      const statusText = item.isOk
        ? `<strong style="color:#15803d;">골든타임 충족</strong> (${diff}분 여유)`
        : `<strong style="color:#b91c1c;">골든타임 미충족</strong> (${Math.abs(diff)}분 초과)`;

      infoWindow.setContent(`
        <div style="font-size:13px;line-height:1.5;max-width:250px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${item.name}</div>
          <div style="color:#475569;font-size:11px;margin-bottom:6px;">${item.address}</div>
          <div>도로 거리: <b>${item.distance_km.toFixed(2)} km</b></div>
          <div>예상 이동시간: <b>${item.eta.toFixed(1)} 분</b></div>
          <div style="margin-top:4px;">${statusText}</div>
        </div>
      `);
      infoWindow.setPosition(position);
      infoWindow.open(map);
    }

    async function loadExternalJsonIfAvailable() {
      try {
        const res = await fetch("./routes_data.json", { cache: "no-store" });
        if (res.ok) {
          const parsed = await res.json();
          if (parsed && parsed.patient && Array.isArray(parsed.routes) && parsed.routes.length > 0) {
            simData = parsed;
          }
        }
      } catch (err) {
        console.warn("routes_data.json을 찾지 못해 기본 샘플 데이터를 사용합니다.", err);
      }
    }

    async function initMap() {
      await loadExternalJsonIfAvailable();

      const pt = simData.patient;
      document.getElementById("patient-summary").textContent =
        `환자 발생지(${pt.id} ${pt.region}) 기준 도로 접근성`;

      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: pt.lat, lng: pt.lng },
        zoom: 12,
        mapTypeControl: true,
        streetViewControl: false
      });

      infoWindow = new google.maps.InfoWindow();

      patientMarker = new google.maps.Marker({
        position: { lat: pt.lat, lng: pt.lng },
        map: map,
        title: `환자 발생 위치 (${pt.id} ${pt.region})`,
        label: {
          text: "P",
          color: "#ffffff",
          fontSize: "12px",
          fontWeight: "bold"
        },
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 13,
          fillColor: "#2563eb",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2.5
        },
        zIndex: 999
      });

      patientMarker.addListener("click", () => {
        infoWindow.setContent(`
          <div style="font-size:13px;">
            <b>환자 발생 위치 (${pt.id})</b><br/>
            발생지역: ${pt.region}<br/>
            좌표: ${pt.lat.toFixed(4)}, ${pt.lng.toFixed(4)}
          </div>
        `);
        infoWindow.setPosition({ lat: pt.lat, lng: pt.lng });
        infoWindow.open(map);
      });

      document.getElementById("delay-slider").addEventListener("input", renderSimulation);
      document.querySelectorAll('input[name="disease"]').forEach((radio) => {
        radio.addEventListener("change", renderSimulation);
      });

      renderSimulation();
    }
  </script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyABcEAcrT5m7PvlYzNsD3fl4BEnCsk0V6k&callback=initMap">
  </script>
</body>
</html>
